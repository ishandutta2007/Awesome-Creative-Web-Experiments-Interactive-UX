<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0c102b" />
      <stop offset="100%" stop-color="#050711" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="orbGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="orbGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="orbGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-opacity="0.12" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg-grid {
      animation: gridPulse 8s ease-in-out infinite alternate;
    }
    .orb-float-1 {
      animation: floatOrb1 10s ease-in-out infinite alternate;
    }
    .orb-float-2 {
      animation: floatOrb2 12s ease-in-out infinite alternate;
    }
    .wave-line {
      stroke-dasharray: 8 6;
      animation: dashMove 14s linear infinite;
    }
    .node-pulse {
      animation: pulseNode 3s ease-in-out infinite;
    }
    .pill {
      backdrop-filter: blur(8px);
      transition: all 0.3s;
    }
    @keyframes gridPulse {
      0% { opacity: 0.5; }
      100% { opacity: 0.9; }
    }
    @keyframes floatOrb1 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(40px, -25px) scale(1.1); }
    }
    @keyframes floatOrb2 {
      0% { transform: translate(0px, 0px) scale(1); }
      100% { transform: translate(-35px, 20px) scale(1.15); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -200; }
    }
    @keyframes pulseNode {
      0%, 100% { opacity: 0.4; r: 3; }
      50% { opacity: 1; r: 5; }
    }
  </style>

  <!-- Deep Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Animated Glowing Background Orbs (Behind All Text) -->
  <g class="orb-float-1">
    <circle cx="220" cy="110" r="160" fill="url(#orbGrad1)" />
  </g>
  <g class="orb-float-2">
    <circle cx="980" cy="300" r="180" fill="url(#orbGrad2)" />
  </g>
  <circle cx="600" cy="40" r="120" fill="url(#orbGrad3)" />

  <!-- Perspective Cyber Grid Layer -->
  <rect width="1200" height="420" rx="16" fill="url(#cyberGrid)" class="bg-grid" />

  <!-- Dynamic Wave & Constellation Lines (Background accents) -->
  <g opacity="0.35">
    <path class="wave-line" d="M -50 340 C 200 280, 450 390, 700 320 C 950 250, 1100 360, 1250 300" fill="none" stroke="#818cf8" stroke-width="2" />
    <path class="wave-line" d="M -50 380 C 250 320, 500 410, 750 350 C 1000 290, 1150 380, 1250 340" fill="none" stroke="#ec4899" stroke-width="1.5" />
    
    <!-- Dynamic constellation dots -->
    <circle class="node-pulse" cx="150" cy="90" r="4" fill="#38bdf8" />
    <circle class="node-pulse" cx="280" cy="60" r="3" fill="#818cf8" />
    <circle class="node-pulse" cx="950" cy="90" r="4" fill="#c084fc" />
    <circle class="node-pulse" cx="1060" cy="120" r="3" fill="#f472b6" />
    <line x1="150" y1="90" x2="280" y2="60" stroke="#38bdf8" stroke-width="0.8" stroke-opacity="0.4" />
    <line x1="950" y1="90" x2="1060" y2="120" stroke="#c084fc" stroke-width="0.8" stroke-opacity="0.4" />
  </g>

  <!-- FOREGROUND CONTENT: Safe high-contrast readability -->
  <!-- Top Tagline Badge -->
  <g transform="translate(600, 75)">
    <rect x="-190" y="-16" width="380" height="32" rx="16" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.2" opacity="0.9" />
    <circle cx="-160" cy="0" r="4" fill="#10b981" />
    <text x="5" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#a5b4fc" letter-spacing="2">
      ⚡ CURATED CREATIVE ECOSYSTEM ⚡
    </text>
  </g>

  <!-- Main Hero Title -->
  <text x="600" y="155" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="url(#titleGrad)" filter="url(#glow)" letter-spacing="-0.5">
    Creative Web Experiments &amp; Interactive UX
  </text>
  <text x="600" y="155" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">
    Creative Web Experiments &amp; Interactive UX
  </text>

  <!-- Subtitle -->
  <text x="600" y="205" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="500" fill="#cbd5e1" letter-spacing="0.4">
    WebGL • GLSL Shaders • Creative Coding • Physics Engines • In-Browser Sandboxes • Reactive Notebooks
  </text>

  <!-- Interactive Ecosystem Feature Pills (Clean layout, non-overlapping) -->
  <g transform="translate(600, 275)">
    <!-- Pill 1: WebGL / WebGPU 3D -->
    <g transform="translate(-450, 0)">
      <rect x="0" y="0" width="160" height="42" rx="21" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" opacity="0.95" />
      <text x="80" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e0f2fe">🎮 Three.js &amp; WebGL</text>
    </g>

    <!-- Pill 2: GLSL Shaders -->
    <g transform="translate(-270, 0)">
      <rect x="0" y="0" width="165" height="42" rx="21" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" opacity="0.95" />
      <text x="82" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#ede9fe">✨ GLSL &amp; Shaders</text>
    </g>

    <!-- Pill 3: Generative Canvas -->
    <g transform="translate(-85, 0)">
      <rect x="0" y="0" width="170" height="42" rx="21" fill="#0f172a" stroke="#c084fc" stroke-width="1.2" opacity="0.95" />
      <text x="85" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fae8ff">🎨 p5.js &amp; Pixi.js</text>
    </g>

    <!-- Pill 4: Micro-interactions & Physics -->
    <g transform="translate(105, 0)">
      <rect x="0" y="0" width="165" height="42" rx="21" fill="#0f172a" stroke="#f472b6" stroke-width="1.2" opacity="0.95" />
      <text x="82" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fce7f3">🕹️ Physics &amp; Motion</text>
    </g>

    <!-- Pill 5: Live Sandboxes -->
    <g transform="translate(290, 0)">
      <rect x="0" y="0" width="160" height="42" rx="21" fill="#0f172a" stroke="#34d399" stroke-width="1.2" opacity="0.95" />
      <text x="80" y="26" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#d1fae5">⚡ Live Sandboxes</text>
    </g>
  </g>

  <!-- Subtle bottom border highlight -->
  <line x1="100" y1="419" x2="1100" y2="419" stroke="url(#titleGrad)" stroke-width="2" opacity="0.6" />
</svg>
